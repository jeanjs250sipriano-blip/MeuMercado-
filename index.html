<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Mercado — supermercados perto de você</title>
<meta name="description" content="Marketplace de supermercados: compare ofertas, monte listas e receba em casa.">
<meta name="theme-color" content="#1F9D55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Mercado">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* =====================================================================
   MEU MERCADO — design system (tokens → base → componentes → áreas)
   ===================================================================== */
:root{
  --green-700:#167842; --green-600:#1F9D55; --green-500:#2DB26A; --green-100:#E3F5EA; --green-50:#F2FAF5;
  --orange-600:#E8820C; --orange-500:#FF9F1C; --orange-100:#FFF1DC;
  --red-600:#C7372F; --red-100:#FDE9E7; --blue-600:#2563EB; --blue-100:#E6EEFF; --yellow-100:#FFF7D6;
  --ink:#1B2B22; --ink-2:#4B5B52; --ink-3:#7A8A81; --line:#E3EAE5; --bg:#F6FBF4; --card:#fff;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(20,50,30,.06),0 6px 20px rgba(20,50,30,.07);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:0 0 .8em} a{color:var(--green-700)} small,.muted{color:var(--ink-3)} .tiny{font-size:.8rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FD6A2;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:100}.skip:focus{left:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
#app{max-width:1180px;margin:0 auto;padding:16px 16px calc(90px + var(--safe-b))}
.stack>*+*{margin-top:14px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1 1 0;min-width:0}
.between{justify-content:space-between} .right{margin-left:auto} .center{text-align:center}
.grid{display:grid;gap:12px} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:880px){.cols.two{grid-template-columns:2fr 1fr}.cols.side{grid-template-columns:260px 1fr}}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--green-700);font-weight:800;font-size:1.15rem;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:9px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px 10px 40px;background:#F4F8F5}
.search input:focus{background:#fff;border-color:var(--green-500);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:19px;height:19px}
.addr-pill{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;max-width:240px;font-size:.9rem}
.addr-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{position:relative;background:none;border:0;padding:8px;border-radius:10px;cursor:pointer;color:var(--ink);display:inline-flex}
.icon-btn:hover{background:var(--green-50)}
.dot{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--orange-500);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media(max-width:720px){.addr-pill{display:none}.brand b{display:none}.top-in{padding:8px 12px}.desk{display:none!important}}
@media(min-width:721px){.mob{display:none!important}}
.areas{display:flex;gap:6px;max-width:1180px;margin:0 auto;padding:0 16px 8px;overflow:auto}
.areas a{padding:5px 12px;border-radius:999px;text-decoration:none;font-size:.85rem;color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;background:#fff}
.areas a.on{background:var(--green-600);color:#fff;border-color:var(--green-600)}

/* ---------- navegação inferior (celular) ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.7rem;color:var(--ink-3);text-decoration:none;position:relative}
.bottom a.on{color:var(--green-700);font-weight:700}

/* ---------- componentes ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--green-600);color:#fff;text-decoration:none;min-height:44px;transition:transform .05s,background .15s}
.btn:hover{background:var(--green-700)} .btn:active{transform:scale(.98)}
.btn.sec{background:var(--green-100);color:var(--green-700)} .btn.sec:hover{background:#cfeedb}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)} .btn.ghost:hover{background:var(--green-50)}
.btn.warn{background:var(--orange-500);color:#1b1200} .btn.danger{background:var(--red-600)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;border-radius:9px} .btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:.88rem;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-100);color:var(--green-700)}
.badge.o{background:var(--orange-100);color:#9a5300}.badge.r{background:var(--red-100);color:var(--red-600)}.badge.b{background:var(--blue-100);color:var(--blue-600)}.badge.g{background:#eceff0;color:#556}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.in{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px}
.in:focus{border-color:var(--green-500);outline:none;box-shadow:0 0 0 3px #d4f2e0}
textarea.in{min-height:84px;resize:vertical}
.field{margin-bottom:12px}.field .err{color:var(--red-600);font-size:.82rem;margin-top:3px}
.alert{border-radius:12px;padding:12px 14px;background:var(--blue-100);color:#1d3f9a;display:flex;gap:10px}
.alert.warn{background:var(--yellow-100);color:#6b5200}.alert.err{background:var(--red-100);color:#8d1f19}.alert.ok{background:var(--green-100);color:var(--green-700)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}.empty .big{font-size:2.6rem}
.sk{background:linear-gradient(90deg,#eef3ef 25%,#f7faf8 37%,#eef3ef 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:10px}@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:22px;height:22px;border:3px solid var(--green-100);border-top-color:var(--green-600);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}@keyframes rot{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);overflow:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--green-700);border-color:var(--green-600)}
.hscroll{display:flex;gap:10px;overflow:auto;padding-bottom:6px;scrollbar-width:thin}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}.t th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.t tr:hover td{background:var(--green-50)}.tw{overflow:auto;border-radius:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi{padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line)}.kpi b{display:block;font-size:1.5rem;letter-spacing:-.02em}.kpi span{font-size:.8rem;color:var(--ink-3)}
.sep{height:1px;background:var(--line);margin:12px 0}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(15,30,22,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + var(--safe-b));animation:up .2s ease-out}
.modal.wide{max-width:820px}
@media(min-width:640px){.ov{align-items:center;padding:20px}.modal{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
#toasts{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
@media(min-width:721px){#toasts{bottom:24px}}
.toast{pointer-events:auto;background:#1b2b22;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:92vw;animation:up .2s}.toast.err{background:var(--red-600)}.toast.ok{background:var(--green-700)}

/* ---------- loja (corredores e produtos) ---------- */
.hero{background:linear-gradient(135deg,var(--green-600),#43c47f);color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden}
.hero h1{font-size:1.5rem;margin-bottom:6px}.hero p{opacity:.95;margin:0}
.hero .art{position:absolute;right:-6px;bottom:-14px;font-size:84px;opacity:.25;transform:rotate(-8deg)}
.market{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.logo-badge{width:56px;height:56px;border-radius:14px;background:var(--green-100);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none;overflow:hidden}
.logo-badge img{width:100%;height:100%;object-fit:cover}
.market.off{opacity:.62}
.aisle{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:#fff;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);text-align:center;font-weight:600;font-size:.88rem;min-height:104px;justify-content:center}
.aisle:hover{border-color:var(--green-500);background:var(--green-50)}.aisle .em{font-size:2rem}
.products{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.products{grid-template-columns:repeat(3,1fr)}}@media(min-width:960px){.products{grid-template-columns:repeat(4,1fr)}}
.prod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.prod .ph{aspect-ratio:1/1;border-radius:12px;background:var(--green-50);display:flex;align-items:center;justify-content:center;font-size:2.8rem;overflow:hidden}
.prod .ph img{width:100%;height:100%;object-fit:contain}
.prod .nm{font-weight:600;font-size:.92rem;line-height:1.25;min-height:2.3em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{font-weight:800;font-size:1.08rem}.price s{font-weight:500;color:var(--ink-3);font-size:.82rem;margin-left:6px}
.prod .tag{position:absolute;top:8px;left:8px}.prod.soldout .ph{filter:grayscale(1);opacity:.55}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--green-100);border-radius:12px;overflow:hidden}
.step button{border:0;background:none;width:42px;height:40px;font-size:1.3rem;font-weight:700;color:var(--green-700);cursor:pointer}.step b{min-width:28px;text-align:center}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(66px + var(--safe-b));z-index:25;max-width:640px;margin:0 auto;background:var(--green-700);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;box-shadow:var(--shadow)}
@media(min-width:721px){.cartbar{bottom:20px}}
.status-track{display:flex;gap:0;margin:8px 0}.status-track .s{flex:1;text-align:center;font-size:.7rem;color:var(--ink-3);position:relative;padding-top:20px}
.status-track .s:before{content:"";position:absolute;top:5px;left:0;right:0;height:4px;background:var(--line)}.status-track .s:after{content:"";position:absolute;top:0;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid #fff}
.status-track .s.done:before,.status-track .s.done:after{background:var(--green-500)}.status-track .s.now{color:var(--green-700);font-weight:700}
.code{font-size:2rem;font-weight:800;letter-spacing:.35em;text-align:center;background:var(--orange-100);border-radius:14px;padding:14px}
.chat{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:#eef3ef;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.msg.me{background:var(--green-100);align-self:flex-end}.msg small{display:block}

/* ---------- painéis (mercado e administração) ---------- */
.panel{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.panel{grid-template-columns:230px 1fr}}
.side{background:#fff;border-radius:16px;padding:10px;border:1px solid var(--line);align-self:start;position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.94rem}
.side a:hover{background:var(--green-50)}.side a.on{background:var(--green-100);color:var(--green-700)}
@media(max-width:899px){.side{flex-direction:row;overflow:auto;position:static}.side a{white-space:nowrap;padding:8px 12px}}
.board{display:grid;gap:12px;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);overflow:auto;padding-bottom:8px}
.col{background:#eef4ef;border-radius:14px;padding:10px;min-height:120px}.col h4{display:flex;justify-content:space-between;font-size:.9rem}
.ocard{background:#fff;border-radius:12px;padding:10px;margin-top:8px;border:1px solid var(--line);cursor:pointer}.ocard.late{border-color:var(--red-600)}
.demo-bar{background:#2b2b2b;color:#ffe08a;font-size:.82rem;padding:6px 12px;text-align:center}
.demo-bar button{background:#ffe08a;color:#2b2b2b;font:inherit;font-weight:600;border:0;border-radius:8px;padding:2px 8px;margin-left:6px;cursor:pointer}
.watermark{position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(-30deg,transparent 0 160px,rgba(255,159,28,.05) 160px 162px)}
.upd{position:fixed;left:12px;right:12px;top:70px;z-index:70;max-width:520px;margin:0 auto}
@media print{.top,.bottom,.side,.cartbar,.no-print{display:none!important}body{background:#fff}}
/* ---------- admin: gráficos e kanban ---------- */
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;overflow-x:auto;padding-bottom:2px}
.bar{flex:1 0 18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:18px}
.bar-fill{width:100%;background:var(--green-500);border-radius:4px 4px 0 0;min-height:2px}
.bar .tiny{font-size:.6rem;color:var(--ink-3);margin-top:2px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.kcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;cursor:pointer;font:inherit;color:inherit}
.kcard:hover{border-color:var(--green-500)}
@media print{.no-print,.top,.bottom,.side,#demo-bar{display:none!important}}
#app:focus,#app:focus-visible{outline:none}
.row>select.in,.row>input.in:not([type=checkbox]){width:auto;flex:1 1 170px;max-width:280px}
.bar{max-width:56px}.bars{justify-content:flex-start}
</style>
</head>

<a class="skip" href="#app">Ir para o conteúdo</a>
<div id="demo-bar" class="demo-bar" hidden></div>
<header class="top" id="top"></header>
<main id="app" tabindex="-1" aria-live="polite"></main>
<nav class="bottom mob" id="bottom" aria-label="Navegação principal"></nav>
<div id="toasts" aria-live="assertive"></div>
<div id="modal-root"></div>
<noscript><div style="padding:24px">O Meu Mercado precisa de JavaScript para funcionar.</div></noscript>
<script>
'use strict';
/* =====================================================================
   MEU MERCADO — aplicação (arquivo único)
   Módulos internos:  CONFIG · UTIL · RULES · API(real/demo) · STATE · UI · ROUTER ·
                      VIEWS: cliente / mercado / administração · PWA · BOOT
   O navegador NUNCA decide preço final, estoque, pagamento, permissão ou estado do pedido:
   tudo isso é validado nas Cloud Functions e nas regras do Firestore.

const DEMO = MM.firebase.apiKey === 'SUBSTITUIR';

/* ───────────────────────── UTIL ───────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2.2l2.3 11h11l2-8H6.3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v11h14V10"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  bag: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8a3 3 0 016 0"/>', store: '<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/>',
  pin: '<path d="M12 21s7-6 7-11a7 7 0 00-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', check: '<path d="M5 12l5 5 9-10"/>', chev: '<path d="M9 6l6 6-6 6"/>',

/* ───────────────────────── API (camada de dados) ─────────────────────────
   Duas implementações com a MESMA interface:
     • realApi  → Firebase (Auth, Firestore, Storage, Cloud Functions)

function emitAuth() { SESSION.listeners.forEach(f => f(SESSION.user)); }
const onAuth = (f) => { SESSION.listeners.push(f); f(SESSION.user); };

function normalize(v) {
  if (v && typeof v === 'object') {
    if (typeof v.toMillis === 'function') return v.toMillis();
    if (Array.isArray(v)) return v.map(normalize);
    const o = {}; for (const k in v) o[k] = normalize(v[k]); return o;

})();

/* ───────────────────────── PWA ───────────────────────── */
let swReg = null;
function setupPWA() {
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.install = e; });
  window.addEventListener('appinstalled', () => { S.install = null; toast('Meu Mercado instalado!', 'ok'); });
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    swReg = reg;
    const offer = (w) => { const b = h('div', { class: 'alert', style: { position: 'fixed', left: '12px', right: '12px', bottom: '84px', zIndex: 60, display: 'flex', gap: '10px', alignItems: 'center', justifyContent: 'space-between' } }, 'Há uma versão nova do app.', h('button', { class: 'btn sm', onclick: () => { w.postMessage('SKIP_WAITING'); } }, 'Atualizar')); document.body.append(b); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
  }).catch((e) => console.warn('Service worker não registrado:', e));
  let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}

/* ───────────────────────── BOOT ───────────────────────── */
async function boot() {
  Object.assign(api, DEMO ? demoApi : realApi);
  try {
    if (DEMO) demoApi.seed();
    if (api.init) await api.init();
  } catch (e) {
    console.error(e);
    $('#app').replaceChildren(h('div', { class: 'card stack center', style: { maxWidth: '520px', margin: '40px auto' } }, h('h2', null, 'Não foi possível iniciar'), h('p', null, 'Verifique sua conexão e a configuração do Firebase (consulte o README).'), h('button', { class: 'btn', onclick: () => location.reload() }, 'Tentar novamente')));
    return;
  }
  setupPWA();
  let lastUid;
  onAuth((u) => { const id = u ? u.uid : null; if (id === lastUid && boot.done) return; lastUid = id; startNotifWatch(); if (boot.done) { CartStore.mergeDown && CartStore.mergeDown(); navigate(); } });
  window.addEventListener('hashchange', navigate);
  window.addEventListener('online', () => toast('Conexão restabelecida', 'ok'));
  window.addEventListener('offline', () => toast('Você está sem internet. Alguns dados podem estar desatualizados.', 'err'));
  updateBadges(); await navigate(); boot.done = true;
}
boot().catch((e) => console.error('boot', e));
